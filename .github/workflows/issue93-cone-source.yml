name: ODE cone production-source regression
on:
  push:
    branches: [issue93/ode-cone-row-pairing]
  pull_request:
    paths:
      - deps/opende/src/quickstep_pgs_lcp.cpp
      - test/issue93/**
      - .github/workflows/issue93-cone-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 2
          lfs: false
          submodules: false
          sparse-checkout: |
            deps/opende/src
            test/issue93
      - name: Obtain only the pinned baseline source history
        run: git fetch --no-tags --depth=1 origin b22c6e15e52299865b31093b8feebc9ca19e26e8
      - name: Apply the hash-guarded edit to production source
        run: python3 test/issue93/apply_pinned_fix.py
      - name: Reproduce original defects and test fixed production function
        run: python3 test/issue93/test_cone_rows.py --output cone-receipt
      - name: Commit only the tested production source on the requested work branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/issue93/ode-cone-row-pairing' && github.repository == 'lxk36/gazebo-classic'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- deps/opende/src/quickstep_pgs_lcp.cpp; then exit 0; fi
          test "$(git diff --name-only)" = deps/opende/src/quickstep_pgs_lcp.cpp
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- deps/opende/src/quickstep_pgs_lcp.cpp
          git commit -m 'fix(ode): pair cone tangents by contact row and initialize ERP bounds' \
            -m 'Validated with ASan/UBSan against the pinned original function and 2162 fixed cases. No friction coefficient, zero-slip rule or solver model retuning. Relates to XGC-Team/xgc2-harness#93; full Gazebo build and physical validation remain outstanding.'
          git push origin HEAD:refs/heads/issue93/ode-cone-row-pairing
          git rev-parse HEAD | tee cone-receipt/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue93-cone-source-receipt
          path: cone-receipt
          retention-days: 14
          if-no-files-found: error
